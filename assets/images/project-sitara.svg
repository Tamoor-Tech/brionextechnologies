<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="sitaraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f1e"/>
      <stop offset="100%" stop-color="#0a050f"/>
    </linearGradient>
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardSitara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261730"/>
      <stop offset="100%" stop-color="#160c1d"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#sitaraBg)" stroke="#381e46" stroke-width="2"/>

  <!-- Browser Window Chrome -->
  <rect x="0" y="0" width="800" height="44" fill="#1e1027" rx="16"/>
  <rect x="0" y="32" width="800" height="12" fill="#1e1027"/>
  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="46" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="5" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="100" y="10" width="460" height="24" rx="6" fill="#0d0612" stroke="#402052"/>
  <text x="120" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c084fc">
    https://sitaraevenetcomplex01.vercel.app
  </text>

  <!-- Client Header -->
  <text x="40" y="86" font-family="Cinzel, Georgia, serif" font-size="19" font-weight="800" letter-spacing="2" fill="#fce7f3">SITARA EVENT COMPLEX</text>
  <rect x="520" y="68" width="80" height="26" rx="4" fill="#2d163a"/>
  <text x="536" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e9d5ff">Halls</text>
  <rect x="616" y="68" width="144" height="26" rx="4" fill="url(#roseGoldGrad)"/>
  <text x="632" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Schedule Venue Tour</text>

  <!-- Hero Content in Mockup -->
  <text x="40" y="145" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">
    Unforgettable Celebrations &amp; Grand Galas
  </text>
  <text x="40" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#e2c5f5">
    Opulent banquet halls, curated gourmet catering, and signature event production.
  </text>

  <!-- Venues / Hall Showcase Grid -->
  <g transform="translate(40, 210)">
    <!-- Hall 1 -->
    <rect width="220" height="135" rx="10" fill="url(#cardSitara)" stroke="#45215c"/>
    <rect x="16" y="16" width="188" height="64" rx="6" fill="#3a1b4e"/>
    <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f472b6">GRAND CRYSTAL BALLROOM</text>
    <text x="20" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Capacity: 1,200 Guests</text>
    <text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#d8b4fe">Chandelier lighting &amp; stage</text>

    <!-- Hall 2 -->
    <rect x="250" width="220" height="135" rx="10" fill="url(#cardSitara)" stroke="#45215c"/>
    <rect x="266" y="16" width="188" height="64" rx="6" fill="#3a1b4e"/>
    <text x="274" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#c084fc">ROYAL SAPPHIRE HALL</text>
    <text x="270" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Capacity: 600 Guests</text>
    <text x="270" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#d8b4fe">Intimate luxury &amp; acoustics</text>

    <!-- Hall 3 -->
    <rect x="500" width="220" height="135" rx="10" fill="url(#cardSitara)" stroke="#45215c"/>
    <rect x="516" y="16" width="188" height="64" rx="6" fill="#3a1b4e"/>
    <text x="524" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f472b6">MAJESTIC LAWN</text>
    <text x="520" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Capacity: 2,500 Guests</text>
    <text x="520" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#d8b4fe">Open-air marquee &amp; gardens</text>
  </g>

  <!-- Inquiry bar -->
  <g transform="translate(40, 370)">
    <rect width="720" height="90" rx="10" fill="#1d0d26" stroke="#4a1e63"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Check Date Availability</text>
    
    <rect x="24" y="46" width="170" height="28" rx="4" fill="#30153f" stroke="#502069"/>
    <text x="36" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e9d5ff">Wedding Reception</text>

    <rect x="206" y="46" width="170" height="28" rx="4" fill="#30153f" stroke="#502069"/>
    <text x="218" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#e9d5ff">Autumn / Winter Season</text>

    <rect x="530" y="44" width="166" height="32" rx="6" fill="url(#roseGoldGrad)"/>
    <text x="554" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Request Venue Pricing</text>
  </g>
</svg>
