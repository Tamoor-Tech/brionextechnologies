<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6639D8"/>
      <stop offset="100%" stop-color="#4823A8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Icon Mark: Hexagonal Tech Core with Neon X -->
  <g transform="translate(6, 6)">
    <!-- Outer Hex Shield -->
    <path d="M24 2 L43 13 L43 35 L24 46 L5 35 L5 13 Z" stroke="url(#brandGrad)" stroke-width="2.5" fill="#11121A" fill-opacity="0.95" />
    <!-- Dynamic Corner Nodes -->
    <circle cx="24" cy="2" r="2.5" fill="#6639D8" />
    <circle cx="43" cy="13" r="2" fill="#6639D8" opacity="0.9" />
    <circle cx="43" cy="35" r="2" fill="#00e599" opacity="0.9" />
    <circle cx="24" cy="46" r="2.5" fill="#00e599" />
    <circle cx="5" cy="35" r="2" fill="#00e599" opacity="0.9" />
    <circle cx="5" cy="13" r="2" fill="#6639D8" opacity="0.9" />
    <!-- Inner Stylized Signature Green X -->
    <path d="M14 14 L34 34 M34 14 L14 34" stroke="#00e599" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="24" cy="24" r="3" fill="#ffffff" />
  </g>

  <!-- Wordmark: Brionex with green X -->
  <text x="64" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5" fill="#ffffff">
    Brione<tspan fill="#00e599">x</tspan>
  </text>
  <text x="65" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#a1a1b5">
    TECHNOLOGIES
  </text>
</svg>
